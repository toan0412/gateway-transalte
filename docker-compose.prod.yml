services:
  gateway:
    ports: !reset []
    environment:
      PUBLIC_URL: https://${DOMAIN}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    command: caddy reverse-proxy --from ${DOMAIN} --to gateway:8787
    volumes:
      - caddy-data:/data
volumes:
  caddy-data:
